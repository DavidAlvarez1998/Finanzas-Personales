<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sin conexion - Finanzas</title>
    <!--
      revision: 1
      Bump this AND the revision in next.config.ts additionalPrecacheEntries
      whenever this file is edited, so Serwist invalidates the precache entry.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: #09090b; /* zinc-950 */
        color: #e4e4e7;      /* zinc-200 */
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 9999px;
        background: #18181b; /* zinc-900 */
        color: #a1a1aa;      /* zinc-400 */
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        line-height: 1.3;
        margin: 0 0 12px;
        color: #fafafa; /* zinc-50 */
      }
      p {
        margin: 0 0 24px;
        color: #a1a1aa; /* zinc-400 */
        line-height: 1.6;
      }
      button {
        appearance: none;
        border: 1px solid #27272a; /* zinc-800 */
        background: #18181b;       /* zinc-900 */
        color: #fafafa;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #27272a; }
      button:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Finanzas</span>
      <h1>Estas sin conexion</h1>
      <p>
        No pudimos cargar la app porque no hay internet. Cuando vuelvas a tener
        conexion, recarga esta pagina para seguir donde lo dejaste.
      </p>
      <button type="button" onclick="window.location.reload()">Recargar</button>
    </main>
  </body>
</html>
